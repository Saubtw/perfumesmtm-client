<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="Catálogo de Perfumes MTM. Encuentra tu fragancia, consulta su precio y haz tu pedido por WhatsApp.">
    <title>Perfumes MTM | Catálogo</title>
  </head>
  <body>
    <header class="site-bar">
      <div class="wrap">
        <a class="wordmark" href="./">Perfumes MTM</a>
        <div class="header-actions">
          <a id="whatsapp" target="_blank" rel="noopener noreferrer">WhatsApp</a>
          <button id="cart-button" type="button" aria-haspopup="dialog">Carrito <span id="cart-count">0</span></button>
        </div>
      </div>
    </header>
    <main class="wrap">
      <div class="catalog-intro">
        <div class="catalog-title">
          <h1>Catálogo<br> de perfumes</h1>
          <p class="intro">Descubre fragancias, consulta sus precios y elige tu próxima firma olfativa.</p>
        </div>
        <img class="catalog-photo" src="/images/hero-botanical-editorial.webp" alt="">
      </div>
      <div class="toolbar">
        <form id="search-form" role="search">
          <label class="sr-only" for="search">Buscar perfume o marca</label>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4 4"/></svg>
          <input id="search" type="search" placeholder="Buscar perfume o marca" autocomplete="off">
        </form>
        <label class="sort-field" for="sort-products">Ordenar por
          <select id="sort-products" aria-label="Ordenar perfumes">
            <option value="featured">Selección</option>
            <option value="name-asc">Nombre: A–Z</option>
            <option value="price-asc">Precio: menor a mayor</option>
            <option value="price-desc">Precio: mayor a menor</option>
          </select>
        </label>
        <p id="result-count" aria-live="polite"></p>
      </div>
      <div id="shop-grid" class="grid"></div>
      <p id="no-results" hidden>No encontramos perfumes con esa búsqueda.</p>
      <p id="shop-status" class="sr-only" role="status"></p>
    </main>
    <dialog id="perfume-detail" aria-labelledby="perfume-title">
      <div class="perfume-panel">
        <header class="perfume-bar">
          <nav aria-label="Navegar por los perfumes">
            <button type="button" data-perfume-step="-1" aria-label="Perfume anterior" aria-keyshortcuts="ArrowLeft" title="Perfume anterior (←)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
            <span id="perfume-position" aria-live="polite" aria-atomic="true"></span>
            <button type="button" data-perfume-step="1" aria-label="Perfume siguiente" aria-keyshortcuts="ArrowRight" title="Perfume siguiente (→)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
          </nav>
          <form method="dialog"><button aria-label="Cerrar ficha" title="Cerrar ficha (Esc)" autofocus><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></form>
        </header>
        <div id="perfume-content"></div>
        <footer class="perfume-footer" id="perfume-order"></footer>
      </div>
    </dialog>
    <dialog id="cart" aria-labelledby="cart-title">
      <header class="cart-header">
        <h2 id="cart-title">Tu carrito</h2>
        <form method="dialog"><button id="close-cart" aria-label="Cerrar carrito">×</button></form>
      </header>
      <div id="cart-items"></div>
      <footer class="cart-footer">
        <p><span>Total</span><strong id="cart-total"></strong></p>
        <a id="checkout" class="checkout" target="_blank" rel="noopener noreferrer" hidden>Enviar pedido por WhatsApp</a>
      </footer>
    </dialog>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
